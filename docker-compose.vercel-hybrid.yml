name: wa-magang-bot-waha

# Mode HYBRID: bot (webhook, panel admin, Telegram) tetap deploy di Vercel seperti biasa.
# Cuma WAHA (engine WhatsApp) yang jalan lokal di sini, diekspos ke internet lewat
# Tailscale Funnel supaya Vercel bisa memanggilnya balik (kirim pesan/typing indicator).
#
# Beda dengan docker-compose.yml (mode full-lokal): di sana ada service "bot" juga dan
# Tailscale cuma pakai "serve" (privat, sesama tailnet). Di sini TIDAK ada service "bot",
# dan Tailscale pakai "funnel" (publik, supaya Vercel yang di luar tailnet bisa akses).

services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_PRINT_QR: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      # Domain Vercel kamu — pesan masuk WhatsApp dikirim WAHA ke sini.
      WHATSAPP_HOOK_URL: ${VERCEL_APP_URL}/api/webhook
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Webhook-Secret:${WAHA_WEBHOOK_SECRET}
    volumes:
      - waha_sessions:/app/.sessions
    # Publish ke localhost SAJA (bukan 0.0.0.0) — biar masih bisa buka dashboard dari komputer ini
    # sendiri buat scan QR, tapi tidak nempel ke semua network interface sebelum Funnel aktif.
    ports:
      - "127.0.0.1:3000:3000"

  # Sidecar Tailscale — network_mode: service:waha artinya sidecar ini "menumpang" network
  # namespace container waha, jadi bisa serve/funnel port 3000 milik waha lewat "localhost:3000".
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: magangjogja-waha
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: service:waha
    depends_on:
      - waha

volumes:
  waha_sessions:
  tailscale_state:
