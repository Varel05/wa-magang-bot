<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MagangJogja Bot - Login</title>
<style>
  :root { --bg: #12151c; --panel: #1a1e28; --border: #2b3040; --text: #e8e9ee; --dim: #8b8fa3; --accent: #ff8a3d; --danger: #ff5c5c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  main { width: min(100%, 340px); }
  .eyebrow { margin: 0 0 8px; color: var(--accent); font: 11px 'Courier New', monospace; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0 0 20px; font-size: 22px; }
  form { display: flex; flex-direction: column; gap: 14px; padding: 28px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  input, button { min-height: 42px; border-radius: 6px; font: inherit; }
  input { padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  button { border: 0; background: var(--accent); color: #1a1108; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .error { min-height: 16px; margin: 0; color: var(--danger); font-size: 13px; }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">MagangJogja Bot</p>
    <h1>Masuk ke panel admin</h1>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Password admin" autocomplete="current-password" autofocus required>
      <button id="loginBtn" type="submit">Masuk</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </main>
<script>
  const form = document.getElementById('loginForm');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  async function login(event) {
    event.preventDefault();
    const password = passwordInput.value.trim();
    if (!password) return;

    loginBtn.disabled = true;
    loginError.textContent = '';
    try {
      const response = await fetch('/api/admin/users', { headers: { 'X-Admin-Password': password } });
      if (response.status === 401) throw new Error('Password salah.');
      if (!response.ok) throw new Error('Gagal terhubung ke server. Coba lagi.');
      sessionStorage.setItem('admin_password', password);
      window.location.replace('dashboard.html');
    } catch (error) {
      loginError.textContent = error.message;
    } finally {
      loginBtn.disabled = false;
    }
  }

  form.addEventListener('submit', login);
  if (sessionStorage.getItem('admin_password')) window.location.replace('dashboard.html');
</script>
</body>
</html>
