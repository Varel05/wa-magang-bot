<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MagangJogja Bot - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main>
    <p class="eyebrow">MagangJogja Bot</p>
    <h1>Masuk ke panel admin</h1>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Password admin" autocomplete="current-password" autofocus required>
      <button id="loginBtn" type="submit">Masuk</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </main>
<script>
  const form = document.getElementById('loginForm');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  async function login(event) {
    event.preventDefault();
    const password = passwordInput.value.trim();
    if (!password) return;

    loginBtn.disabled = true;
    loginError.textContent = '';
    try {
      const response = await fetch('/api/admin/users', { headers: { 'X-Admin-Password': password } });
      if (response.status === 401) throw new Error('Password salah.');
      if (!response.ok) throw new Error('Gagal terhubung ke server. Coba lagi.');
      sessionStorage.setItem('admin_password', password);
      window.location.replace('dashboard.html');
    } catch (error) {
      loginError.textContent = error.message;
    } finally {
      loginBtn.disabled = false;
    }
  }

  form.addEventListener('submit', login);
  if (sessionStorage.getItem('admin_password')) window.location.replace('dashboard.html');
</script>
</body>
</html>
