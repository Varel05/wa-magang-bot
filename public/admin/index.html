<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MagangJogja Bot — Admin</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1a1e28;
    --panel-raised: #212635;
    --border: #2b3040;
    --text: #e8e9ee;
    --text-dim: #8b8fa3;
    --accent: #ff8a3d;
    --accent-dim: #4a3626;
    --wa-color: #3ddc84;
    --tg-color: #4dabf7;
    --danger: #ff5c5c;
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  /* ---------- Login gate ---------- */
  #loginGate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    padding: 24px;
  }

  #loginGate h1 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
  }

  #loginGate .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  input[type="password"], textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    outline: none;
  }
  input[type="password"]:focus, textarea:focus { border-color: var(--accent); }

  button {
    background: var(--accent);
    color: #1a1108;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

  .error-text { color: var(--danger); font-size: 13px; margin: 0; min-height: 16px; }

  /* ---------- App shell ---------- */
  #app { display: none; min-height: 100vh; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  nav.tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border); }
  nav.tabs button {
    background: none;
    color: var(--text-dim);
    border-radius: 0;
    padding: 12px 4px;
    margin-right: 24px;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  main { flex: 1; overflow: hidden; }
  .view { display: none; height: 100%; }
  .view.active { display: flex; }

  /* ---------- Riwayat view ---------- */
  #convList {
    width: 300px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: default;
  }
  .conv-item:hover { background: var(--panel); }
  .conv-item.active { background: var(--panel-raised); }
  .chip {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .chip.whatsapp { background: rgba(61,220,132,0.15); color: var(--wa-color); }
  .chip.telegram { background: rgba(77,171,247,0.15); color: var(--tg-color); }
  .conv-id {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .unread-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .edit-name-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-family: var(--font-body);
    font-weight: 500;
    flex-shrink: 0;
  }
  .edit-name-btn:hover { color: var(--text); border-color: var(--accent); }

  #chatPanel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #chatHeader {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
  }
  #chatHeader > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chatMessages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .bubble.user { align-self: flex-end; background: var(--accent-dim); color: var(--text); border-bottom-right-radius: 2px; }
  .bubble.model { align-self: flex-start; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 2px; }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }

  /* ---------- FAQ view ---------- */
  #faqView { flex-direction: column; padding: 24px; gap: 14px; max-width: 780px; margin: 0 auto; width: 100%; }
  #faqView label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }
  #faqTextarea { width: 100%; min-height: 420px; resize: vertical; line-height: 1.6; }
  .faq-status { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .faq-actions { display: flex; align-items: center; gap: 12px; }
  .toast { font-size: 13px; padding: 6px 0; min-height: 20px; }
  .toast.success { color: var(--wa-color); }
  .toast.error { color: var(--danger); }

  /* ---------- Notifikasi ---------- */
  #notifToastContainer {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 999;
    width: 300px;
  }
  .notif-toast {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    cursor: pointer;
    animation: notifIn 0.15s ease-out;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .notif-toast:hover { background: var(--panel); }
  .notif-toast .notif-title { font-weight: 600; margin-bottom: 3px; }
  .notif-toast .notif-preview { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes notifIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .back-btn { display: none; }

  /* ---------- Responsif: tablet & mobile ---------- */
  @media (max-width: 860px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 16px; }
    nav.tabs { padding: 0 16px; overflow-x: auto; }
    nav.tabs button { margin-right: 18px; padding: 12px 2px; white-space: nowrap; }

    #faqView { padding: 16px; gap: 12px; }
    #faqTextarea { min-height: 320px; font-size: 16px; } /* 16px biar iOS Safari tidak auto-zoom saat fokus */
    .faq-actions { flex-wrap: wrap; }
    .faq-actions button { flex: 1; min-width: 140px; }

    #notifToastContainer { left: 12px; right: 12px; top: 12px; width: auto; }

    /* Layout master-detail: daftar & chat gantian tampil, bukan berdampingan */
    #riwayatView { position: relative; overflow: hidden; }
    #convList { width: 100%; border-right: none; }
    #chatPanel {
      position: absolute;
      inset: 0;
      background: var(--bg);
      transform: translateX(100%);
      transition: transform 0.18s ease-out;
    }
    #riwayatView.mobile-chat-active #convList { display: none; }
    #riwayatView.mobile-chat-active #chatPanel { transform: translateX(0); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--accent);
      padding: 0 0 0 0;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .conv-item { padding: 14px 12px 14px 16px; }
    .edit-name-btn { padding: 6px 10px; } /* target sentuh lebih nyaman */

    .bubble { max-width: 85%; }
  }

  @media (max-width: 480px) {
    #loginGate { padding: 16px; }
    .login-box { padding: 20px; }
    header .eyebrow { display: none; } /* hemat ruang di layar sangat sempit */
    .chip { padding: 3px 6px; }
    .edit-name-btn { font-size: 11px; padding: 6px 8px; }
  }
</style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div id="loginGate">
    <p class="eyebrow">MagangJogja Bot</p>
    <h1>Masuk ke panel admin</h1>
    <div class="login-box">
      <input type="password" id="passwordInput" placeholder="Password admin" autofocus>
      <button id="loginBtn">Masuk</button>
      <p class="error-text" id="loginError"></p>
    </div>
  </div>

  <!-- Toast notifikasi pesan baru -->
  <div id="notifToastContainer"></div>

  <!-- APP -->
  <div id="app">
    <header>
      <div>
        <p class="eyebrow">MagangJogja Bot</p>
        <h1>Panel Admin</h1>
      </div>
      <button class="secondary" id="logoutBtn">Keluar</button>
    </header>

    <nav class="tabs">
      <button data-tab="riwayat" class="active">Riwayat Pesan</button>
      <button data-tab="faq">Edit FAQ</button>
    </nav>

    <main>
      <div class="view active" id="riwayatView">
        <div id="convList"><div class="empty-state">Memuat daftar percakapan…</div></div>
        <div id="chatPanel">
          <div class="empty-state">Pilih percakapan di sebelah kiri untuk melihat riwayatnya.</div>
        </div>
      </div>

      <div class="view" id="faqView">
        <div>
          <label for="faqTextarea">Isi FAQ / informasi program magang</label>
          <p class="faq-status" id="faqStatus"></p>
        </div>
        <textarea id="faqTextarea" spellcheck="false"></textarea>
        <div class="faq-actions">
          <button id="saveFaqBtn">Simpan perubahan</button>
          <button class="secondary" id="reloadFaqBtn">Muat ulang</button>
        </div>
        <p class="toast" id="faqToast"></p>
      </div>
    </main>
  </div>

<script>
  const state = { password: null, conversations: [], activeConv: null, lastNotifiedAt: 0, unreadCount: 0, unreadByConv: {} };
  const ORIGINAL_TITLE = document.title;

  const $ = (sel) => document.querySelector(sel);

  function apiFetch(path, opts = {}) {
    return fetch(path, {
      ...opts,
      headers: {
        'X-Admin-Password': state.password,
        ...(opts.headers || {}),
      },
    });
  }

  // ---------- Login ----------
  $('#loginBtn').addEventListener('click', login);
  $('#passwordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

  async function login() {
    const pw = $('#passwordInput').value.trim();
    if (!pw) return;
    state.password = pw;

    const res = await apiFetch('/api/admin/users');
    if (res.status === 401) {
      $('#loginError').textContent = 'Password salah.';
      state.password = null;
      return;
    }
    if (!res.ok) {
      $('#loginError').textContent = 'Gagal terhubung ke server. Coba lagi.';
      return;
    }

    sessionStorage.setItem('admin_password', pw);
    $('#loginGate').style.display = 'none';
    $('#app').style.display = 'flex';
    initApp();
  }

  $('#logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('admin_password');
    location.reload();
  });

  // Auto-login kalau password sudah tersimpan di sessionStorage
  (function tryAutoLogin() {
    const saved = sessionStorage.getItem('admin_password');
    if (saved) {
      $('#passwordInput').value = saved;
      login();
    }
  })();

  // ---------- Tabs ----------
  document.querySelectorAll('nav.tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
      btn.classList.add('active');
      $('#' + btn.dataset.tab + 'View').classList.add('active');
      if (btn.dataset.tab === 'faq') loadFaq();
    });
  });

  function initApp() {
    loadConversations();
    state.lastNotifiedAt = Date.now(); // cuma notifikasi pesan yang masuk SETELAH buka panel ini
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
    setInterval(pollNotifications, 6000);
  }

  async function pollNotifications() {
    if (!state.password) return;
    try {
      const res = await apiFetch('/api/admin/notifications?since=' + state.lastNotifiedAt);
      if (!res.ok) return;
      const data = await res.json();
      const notifications = data.notifications || [];
      if (!notifications.length) return;

      notifications.forEach(handleIncomingNotification);
      state.lastNotifiedAt = Math.max(...notifications.map((n) => n.timestamp));
    } catch (err) {
      // polling gagal sesekali bukan masalah besar — coba lagi di interval berikutnya
    }
  }

  function handleIncomingNotification(notif) {
    const conv = state.conversations.find((c) => c.channel === notif.channel && c.id === String(notif.contactId));
    const label = conv && conv.name ? conv.name : notif.contactId;

    // Tandai unread di daftar percakapan (kecuali kalau percakapan itu sedang dibuka)
    const isCurrentlyOpen = state.activeConv && state.activeConv.channel === notif.channel && state.activeConv.id === String(notif.contactId);
    if (!isCurrentlyOpen) {
      const key = notif.channel + ':' + notif.contactId;
      state.unreadByConv[key] = true;
      state.unreadCount += 1;
      updateTabTitle();
    }

    // Kalau kontaknya belum ada di daftar (chat pertama dari orang baru), muat ulang daftar
    if (!conv) loadConversations();

    renderConvList();
    showToast(label, notif.preview, notif.channel, notif.contactId);
    showBrowserNotification(label, notif.preview);
  }

  function updateTabTitle() {
    document.title = state.unreadCount > 0 ? '(' + state.unreadCount + ') ' + ORIGINAL_TITLE : ORIGINAL_TITLE;
  }

  function showToast(title, preview, channel, contactId) {
    const container = $('#notifToastContainer');
    const el = document.createElement('div');
    el.className = 'notif-toast';
    el.innerHTML =
      '<div class="notif-title">' + (channel === 'whatsapp' ? '📱' : '✈️') + ' ' + title + '</div>' +
      '<div class="notif-preview">' + preview + '</div>';
    el.addEventListener('click', () => {
      el.remove();
      // Buka tab riwayat & pilih percakapan ini
      document.querySelector('nav.tabs button[data-tab="riwayat"]').click();
      const conv = state.conversations.find((c) => c.channel === channel && c.id === String(contactId));
      if (conv) {
        const itemEl = Array.from(document.querySelectorAll('.conv-item')).find((it) => it.dataset.key === channel + ':' + contactId);
        if (itemEl) selectConv(conv, itemEl);
      }
    });
    container.appendChild(el);
    setTimeout(() => el.remove(), 8000);
  }

  function showBrowserNotification(title, preview) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible') return; // tab lagi dibuka & terlihat, toast in-page sudah cukup
    new Notification(title + ' — pesan baru', { body: preview });
  }

  // ---------- Riwayat Pesan ----------
  async function loadConversations() {
    const res = await apiFetch('/api/admin/users');
    const data = await res.json();
    state.conversations = data.conversations || [];
    renderConvList();
  }

  function renderConvList() {
    const el = $('#convList');
    if (!state.conversations.length) {
      el.innerHTML = '<div class="empty-state">Belum ada percakapan tersimpan.</div>';
      return;
    }
    el.innerHTML = '';
    state.conversations.forEach((conv) => {
      const item = document.createElement('div');
      item.className = 'conv-item';
      const key = conv.channel + ':' + conv.id;
      item.dataset.key = key;
      const label = conv.name ? conv.name : conv.id;
      const isUnread = Boolean(state.unreadByConv[key]);
      item.innerHTML =
        '<span class="chip ' + conv.channel + '">' + (conv.channel === 'whatsapp' ? 'WA' : 'TG') + '</span>' +
        '<span class="conv-id" title="' + conv.id + '">' + (isUnread ? '<span class="unread-dot"></span>' : '') + label + '</span>' +
        '<button class="edit-name-btn">Ubah nama</button>';
      item.querySelector('.conv-id').addEventListener('click', () => selectConv(conv, item));
      item.querySelector('.chip').addEventListener('click', () => selectConv(conv, item));
      item.querySelector('.edit-name-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        editContactName(conv);
      });
      el.appendChild(item);
    });
  }

  async function editContactName(conv) {
    const current = conv.name || '';
    const input = window.prompt('Nama panggilan untuk ' + conv.id + ' (kosongkan untuk hapus nama):', current);
    if (input === null) return; // dibatalkan

    const res = await apiFetch('/api/admin/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channel: conv.channel, id: conv.id, name: input }),
    });

    if (res.ok) {
      conv.name = input.trim() || null;
      renderConvList();
      if (state.activeConv && state.activeConv.id === conv.id && state.activeConv.channel === conv.channel) {
        state.activeConv.name = conv.name;
        updateChatHeaderName();
      }
    } else {
      alert('Gagal menyimpan nama. Coba lagi.');
    }
  }

  function updateChatHeaderName() {
    const headerEl = $('#chatHeader');
    if (!headerEl || !state.activeConv) return;
    const conv = state.activeConv;
    const label = conv.name ? conv.name + ' (' + conv.id + ')' : conv.id;
    headerEl.textContent = (conv.channel === 'whatsapp' ? 'WhatsApp' : 'Telegram') + ' · ' + label;
  }

  async function selectConv(conv, itemEl) {
    document.querySelectorAll('.conv-item').forEach((e) => e.classList.remove('active'));
    itemEl.classList.add('active');
    state.activeConv = conv;
    $('#riwayatView').classList.add('mobile-chat-active'); // di mobile: pindah tampilan ke panel chat

    // Bersihkan status unread untuk percakapan ini
    const key = conv.channel + ':' + conv.id;
    if (state.unreadByConv[key]) {
      delete state.unreadByConv[key];
      state.unreadCount = Math.max(0, state.unreadCount - 1);
      updateTabTitle();
      renderConvList();
      itemEl = document.querySelector('.conv-item[data-key="' + key + '"]');
      if (itemEl) itemEl.classList.add('active');
    }

    $('#chatPanel').innerHTML = '<div class="empty-state">Memuat riwayat…</div>';

    const res = await apiFetch('/api/admin/history?channel=' + encodeURIComponent(conv.channel) + '&id=' + encodeURIComponent(conv.id));
    const data = await res.json();
    renderChat(conv, data.history || []);
  }

  function renderChat(conv, history) {
    const panel = $('#chatPanel');
    const label = conv.name ? conv.name + ' (' + conv.id + ')' : conv.id;
    panel.innerHTML =
      '<div id="chatHeader"><button class="back-btn" id="backToListBtn">← Kembali</button><div>' + (conv.channel === 'whatsapp' ? 'WhatsApp' : 'Telegram') + ' · ' + label + '</div></div>' +
      '<div id="chatMessages"></div>';
    panel.querySelector('#backToListBtn').addEventListener('click', () => {
      $('#riwayatView').classList.remove('mobile-chat-active');
    });
    const msgEl = panel.querySelector('#chatMessages');
    if (!history.length) {
      msgEl.innerHTML = '<div class="empty-state">Belum ada riwayat pesan (mungkin sudah kedaluwarsa).</div>';
      return;
    }
    history.forEach((h) => {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (h.role === 'user' ? 'user' : 'model');
      bubble.textContent = h.text;
      msgEl.appendChild(bubble);
    });
    msgEl.scrollTop = msgEl.scrollHeight;
  }

  // ---------- Edit FAQ ----------
  let faqLoaded = false;
  async function loadFaq() {
    if (faqLoaded) return;
    faqLoaded = true;
    const res = await apiFetch('/api/admin/faq');
    const data = await res.json();
    $('#faqTextarea').value = data.content || '';
    $('#faqStatus').textContent = data.isCustom
      ? '✓ Memakai versi custom (sudah pernah diedit)'
      : 'Memakai versi default bawaan (belum pernah diedit)';
  }

  $('#reloadFaqBtn').addEventListener('click', () => { faqLoaded = false; loadFaq(); });

  $('#saveFaqBtn').addEventListener('click', async () => {
    const content = $('#faqTextarea').value;
    const btn = $('#saveFaqBtn');
    const toast = $('#faqToast');
    btn.disabled = true;
    toast.textContent = 'Menyimpan…';
    toast.className = 'toast';

    try {
      const res = await apiFetch('/api/admin/faq', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal menyimpan.');
      toast.textContent = '✓ Tersimpan. Perubahan langsung berlaku ke bot, tanpa perlu deploy ulang.';
      toast.className = 'toast success';
      faqLoaded = false;
      loadFaq();
    } catch (err) {
      toast.textContent = '✗ ' + err.message;
      toast.className = 'toast error';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
